[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lipid-nanoparticle-mrna-engine"
version = "2.0.0"
description = "LNP-Formulator: Ionizable Lipid pKa & mRNA Encapsulation Efficiency Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
lipid-nanoparticle-mrna-engine = "lnp_formulator.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/lipid-nanoparticle-mrna-engine"
Repository = "https://github.com/abusuraihsakhri/lipid-nanoparticle-mrna-engine.git"
